name: sync

# Publishes the redistributable slice of fontist-archive-private into THIS
# repo's main branch: coverage/, details/, woff/, per-style metadata/ + the
# fonts.json family registry. jsDelivr serves them and the site pins by SHA.
#
# Layout follows coverage-architecture.md / TODO.archives/16:
#   woff/{formula_slug}/{PSName}.woff   (per-face, open-license only)
# The legacy flat fonts/ tree is removed by bin/sync-from-private.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync]
  # Auto-run when sync LOGIC lands on main (a merged PR). Path-filtered to code
  # ONLY: the sync's own commits (coverage/, woff/, metadata/, fonts.json,
  # .last-synced-sha) never touch these paths, so it cannot self-trigger a loop.
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Always operate on main. workflow_dispatch can be launched from any
      # branch; without pinning, checkout would follow that ref and the plain
      # `git push` below would publish to it instead of main. The published
      # data must only ever live on main.
      - uses: actions/checkout@v4
        with:
          ref: main

      # The expensive part of this job is pulling ~1 GB of coverage/ and woff/
      # out of archive-private. On a 6-hourly cron most runs have nothing to
      # do, so compare archive-private's HEAD against the SHA recorded by the
      # last successful sync (committed as .last-synced-sha on main) and skip
      # everything when it hasn't moved. One API call instead of ~1 GB.
      #
      # workflow_dispatch AND push (a merged change to the sync logic itself)
      # always force a full run — otherwise a sync-logic change that must be
      # re-applied would be skipped whenever archive-private hasn't moved. This
      # is also the manual escape hatch if the recorded SHA ever drifts from the
      # published contents.
      - name: Check whether archive-private has changed
        id: changed
        env:
          GH_TOKEN: ${{ secrets.FONTIST_CI_PAT_TOKEN }}
        run: |
          upstream="$(gh api repos/fontist/fontist-archive-private/commits/main --jq '.sha')"
          if [ -z "$upstream" ]; then
            echo "::error::could not resolve archive-private HEAD"
            exit 1
          fi
          previous="$(cat .last-synced-sha 2>/dev/null || echo none)"
          echo "  upstream:  $upstream"
          echo "  last sync: $previous"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$upstream" = "$previous" ] \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && [ "${{ github.event_name }}" != "push" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "archive-private unchanged — skipping the ~1 GB pull"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Sparse-checkout omits raw/ (4.0 GB of the private repo's 6.1 GB) — the
      # sync only publishes coverage/, details/, woff/ and metadata/. Cone mode
      # still includes top-level files, so fonts.json comes along; the aggregate
      # font-metadata.json is intentionally NOT published (per-style metadata/
      # replaced it). actions/checkout handles auth and token masking; do not
      # replace this with a hand-rolled clone embedding a token in the URL.
      - name: Check out fontist-archive-private
        if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: fontist/fontist-archive-private
          token: ${{ secrets.FONTIST_CI_PAT_TOKEN }}
          path: private
          filter: blob:none
          sparse-checkout: |
            coverage
            details
            woff
            metadata

      - name: Sync from private repo
        if: steps.changed.outputs.run == 'true'
        run: |
          chmod +x bin/sync-from-private
          ./bin/sync-from-private private

      - name: Commit and push
        id: commit
        if: steps.changed.outputs.run == 'true'
        run: |
          git config user.name "Fontist Bot"
          git config user.email "bot@fontist.org"
          echo "${{ steps.changed.outputs.upstream }}" > .last-synced-sha
          # git add -A stages everything: the synced coverage/details/woff and
          # registries, the updated .last-synced-sha, AND the removal of the
          # legacy fonts/ tree that sync-from-private just deleted. The private/
          # checkout is gitignored, so it is not staged.
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync from fontist-archive-private $(date -u +%Y-%m-%dT%H:%M)"
            # Explicit target: publish only to main regardless of the ref the
            # workflow was dispatched from.
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger fontist.org rebuild
        if: steps.commit.outputs.committed == 'true'
        env:
          FONTIST_CI_PAT_TOKEN: ${{ secrets.FONTIST_CI_PAT_TOKEN }}
        run: bin/trigger-fontist-org-rebuild
